name: Test and Push

on:
  push:
    branches: &branches
      - main
    paths: &paths
      - 'datacube_alchemist/**'
      - 'tests/**'
      - '.github/workflows/test-and-push.yml'
      - '.pre-commit-config.yaml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'pyproject.toml'
      - 'uv.lock'

  pull_request:
    branches: *branches
    paths: *paths

  release:
    types: [created, edited]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: opendatacube/datacube-alchemist

permissions: {}

# When a PR is updated, cancel the jobs from the previous version. Merges
# do not define head_ref, so use run_id to never cancel those jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
      with:
        args: 'format --check --diff'

    - name: Build the docker container
      run: |
        docker compose build

    - name: Bring up the docker container
      run: |
        docker compose up -d --wait --quiet-pull

    - name: Run tests
      run: |
        docker compose exec -T alchemist /bin/bash --login -c \
          "datacube system init && \
            pytest --cov=./datacube_alchemist --cov-report=xml tests"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        use_oidc: true
        fail_ci_if_error: false

  push:
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    name: Build docker image and push to GHCR
    needs: test
    timeout-minutes: 45
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # This is required for requesting the JWT+cosign
      contents: read    # This is required for actions/checkout
      packages: write  # This is required for pushing to ghcr
      attestations: write # This is required for pushing the attestation
      artifact-metadata: write # This is required for creating the storage record


    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Get Git commit timestamps
        run: |
          TIMESTAMP=$(git log -1 --pretty=%ct pyproject.toml uv.lock datacube_ows)
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
        env:
          SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}

      - name: Attest Docker image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Sign the Docker image
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: (r=5;while ! echo "${TAGS}" | xargs -I {} cosign sign --yes --recursive {}@${DIGEST} ; do ((--r))||exit;sleep 15;done)
