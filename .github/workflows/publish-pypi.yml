name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

# When a PR is updated, cancel the jobs from the previous version. Merges
# do not define head_ref, so use run_id to never cancel those jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  publish_pypi:
    if: github.repository == 'opendatacube/datacube-alchemist'
    timeout-minutes: 35
    runs-on: ubuntu-latest
    # Permit authenticating to PyPI
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Prevent cache poisoning for releases.
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build Packages
        run: |
          SETUPTOOLS_SCM_PRETEND_VERSION=$(git describe --abbrev=0 --tags)
          export SETUPTOOLS_SCM_PRETEND_VERSION
          uv build
          uv tool run twine check --strict dist/*

      # Uses to OIDC identification between GitHub and PyPI
      - name: Upload package to PyPI on GitHub Release
        if: "github.repository_owner == 'opendatacube' && github.event.action == 'published'"
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
